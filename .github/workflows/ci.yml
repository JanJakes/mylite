name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-clang
            os: macos-latest
            cc: clang
          - name: ubuntu-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: ubuntu-clang
            os: ubuntu-24.04
            cc: clang
          - name: windows-clang
            os: windows-2025
            cc: clang

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install build tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            command -v ninja >/dev/null 2>&1 || choco install ninja --no-progress -y
            command -v clang >/dev/null 2>&1 || choco install llvm --no-progress -y
            vcpkg install zlib:x64-windows
            vcpkg_bin="$(cygpath -w "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin")"
            printf '%s\n' "$vcpkg_bin" >> "$GITHUB_PATH"
          elif command -v ninja >/dev/null 2>&1; then
            exit 0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset ci \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows \
              -DVCPKG_APPLOCAL_DEPS=OFF
          else
            cmake --preset ci
          fi

      - name: Build
        run: cmake --build --preset ci

      - name: Prepare test temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspaceRoot = (Get-Location).Drive.Root
          New-Item -ItemType Directory -Force -Path (Join-Path $workspaceRoot 'tmp') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:SystemDrive 'tmp') | Out-Null

      - name: Test
        run: ctest --preset ci --output-on-failure --output-junit build/ci/ctest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctest-${{ matrix.name }}
          path: build/ci/ctest.xml
          if-no-files-found: ignore

  debug:
    name: ubuntu-clang-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Configure
        env:
          CC: clang
        run: cmake --preset debug-ci

      - name: Build
        run: cmake --build --preset debug-ci

      - name: Test
        run: ctest --preset debug-ci --output-on-failure --output-junit build/debug-ci/ctest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctest-ubuntu-clang-debug
          path: build/debug-ci/ctest.xml
          if-no-files-found: ignore

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            preset: asan-ubsan
          - name: tsan-concurrency
            preset: tsan
          - name: allocator-fault-injection
            preset: fault-injection

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Configure
        env:
          CC: clang
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: >-
          ctest --preset ${{ matrix.preset }} --output-on-failure
          --output-junit build/${{ matrix.preset }}/ctest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctest-${{ matrix.name }}
          path: build/${{ matrix.preset }}/ctest.xml
          if-no-files-found: ignore

  clang-tools:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-format-19 clang-tidy-19 ninja-build

      - name: Configure
        env:
          CC: clang
        run: cmake --preset dev

      - name: Check formatting
        run: cmake --build --preset format-check

      - name: Run clang-tidy
        run: cmake --build --preset tidy

  php-extensions:
    name: php-extensions
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install PHP build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build php-cli php-dev

      - name: Configure
        run: cmake --preset php-ci

      - name: Build
        run: cmake --build --preset php-ci

      - name: Test
        run: ctest --preset php-ci -R '^php-ext' --output-on-failure

  mysql-runtime-expectations:
    name: mysql-runtime-expectations
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Start MySQL 8.4.9
        run: |
          docker run \
            --name mylite-mysql-849 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_ROOT_HOST=% \
            -d mysql:8.4.9@sha256:14690274f4967ba207939c97dd79a8d6604f1d532218ea6be69c0001ddd2d45f \
            --skip-log-bin
          for _ in $(seq 1 120); do
            if docker exec mylite-mysql-849 mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent; then
              docker exec mylite-mysql-849 mysql --protocol=TCP -h127.0.0.1 -uroot \
                --batch --raw --skip-column-names -e 'SELECT VERSION();'
              exit 0
            fi
            sleep 1
          done
          docker logs mylite-mysql-849
          exit 1

      - name: Run MySQL runtime expectation scripts
        run: tools/run-mysql-runtime-expectations

  wordpress-phpunit:
    name: wordpress-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MYLITE_WORDPRESS_REF: 6ddfc9d9b532c6e95c1266165149815895e2eb56
      MYLITE_WORDPRESS_CMAKE_BUILD_TYPE: Release
      MYLITE_WORDPRESS_DB_PATH: /dev/shm/mylite-wordpress-tests.mylite
      MYLITE_MYSQLI_PROFILE: build/wordpress-mysqli-profile.log
      MYLITE_MYSQLI_PROFILE_LIMIT: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build WordPress PHPUnit Docker image
        run: tools/wordpress-phpunit-mysqli-mylite image

      - name: Fetch WordPress test checkout
        run: tools/wordpress-phpunit-mysqli-mylite fetch-wordpress

      - name: Build MyLite PHP extensions
        run: tools/wordpress-phpunit-mysqli-mylite build-extensions

      - name: Install WordPress PHPUnit dependencies
        run: tools/wordpress-phpunit-mysqli-mylite install-dependencies

      - name: Run full WordPress PHPUnit test suite
        run: tools/wordpress-phpunit-mysqli-mylite test

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            build/wordpress-tests.mylite \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-php-mylite \
            2>/dev/null || true
          df -h .

  drupal-phpunit:
    name: drupal-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      MYLITE_DRUPAL_REF: 11.3.11
      MYLITE_DRUPAL_CMAKE_BUILD_TYPE: Release
      MYLITE_MYSQLI_PROFILE: build/drupal-mysqli-profile.log
      MYLITE_MYSQLI_PROFILE_LIMIT: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build Drupal PHPUnit Docker image
        run: tools/drupal-phpunit-mysqli-mylite image

      - name: Fetch Drupal test checkout
        run: tools/drupal-phpunit-mysqli-mylite fetch-drupal

      - name: Build MyLite PHP extensions
        run: tools/drupal-phpunit-mysqli-mylite build-extensions

      - name: Install Drupal PHPUnit dependencies
        run: tools/drupal-phpunit-mysqli-mylite install-dependencies

      - name: Run Drupal database PHPUnit test suite
        run: tools/drupal-phpunit-mysqli-mylite test

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            build/drupal-core/core/drupal-tests.mylite \
            build/drupal-core \
            build/drupal-php-mylite \
            2>/dev/null || true
          df -h .

  laravel-phpunit:
    name: laravel-phpunit-pdo-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MYLITE_LARAVEL_REF: v12.62.0
      MYLITE_LARAVEL_CMAKE_BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build Laravel PHPUnit Docker image
        run: tools/laravel-phpunit-pdo-mylite image

      - name: Fetch Laravel test checkout
        run: tools/laravel-phpunit-pdo-mylite fetch-laravel

      - name: Build MyLite PHP extensions
        run: tools/laravel-phpunit-pdo-mylite build-extensions

      - name: Install Laravel PHPUnit dependencies
        run: tools/laravel-phpunit-pdo-mylite install-dependencies

      - name: Run Laravel database PHPUnit test suite
        run: tools/laravel-phpunit-pdo-mylite test

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            build/laravel-tests.mylite \
            build/laravel-framework \
            build/laravel-mylite-tests \
            build/laravel-php-mylite \
            2>/dev/null || true
          df -h .

  doctrine-phpunit:
    name: doctrine-phpunit-pdo-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MYLITE_DOCTRINE_DBAL_REF: 4.4.3
      MYLITE_DOCTRINE_ORM_REF: 3.6.7
      MYLITE_DOCTRINE_CMAKE_BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build Doctrine PHPUnit Docker image
        run: tools/doctrine-phpunit-pdo-mylite image

      - name: Fetch Doctrine test checkouts
        run: tools/doctrine-phpunit-pdo-mylite fetch-doctrine

      - name: Build MyLite PHP extensions
        run: tools/doctrine-phpunit-pdo-mylite build-extensions

      - name: Install Doctrine PHPUnit dependencies
        run: tools/doctrine-phpunit-pdo-mylite install-dependencies

      - name: Run Doctrine DBAL and ORM PHPUnit test suite
        run: tools/doctrine-phpunit-pdo-mylite test

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            build/doctrine-dbal-tests.mylite \
            build/doctrine-orm-tests.mylite \
            build/doctrine-dbal \
            build/doctrine-orm \
            build/doctrine-mylite-tests \
            build/doctrine-php-mylite \
            2>/dev/null || true
          df -h .

  mediawiki-phpunit:
    name: mediawiki-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MYLITE_MEDIAWIKI_REF: REL1_42
      MYLITE_MEDIAWIKI_CMAKE_BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build MediaWiki PHPUnit Docker image
        run: tools/mediawiki-phpunit-mysqli-mylite image

      - name: Fetch MediaWiki test checkout
        run: tools/mediawiki-phpunit-mysqli-mylite fetch-mediawiki

      - name: Build MyLite PHP extensions
        run: tools/mediawiki-phpunit-mysqli-mylite build-extensions

      - name: Install MediaWiki PHPUnit dependencies
        run: tools/mediawiki-phpunit-mysqli-mylite install-dependencies

      - name: Run MediaWiki database PHPUnit test suite
        run: tools/mediawiki-phpunit-mysqli-mylite test

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            build/mediawiki-tests.mylite \
            build/mediawiki-core \
            build/mediawiki-php-mylite \
            2>/dev/null || true
          df -h .
