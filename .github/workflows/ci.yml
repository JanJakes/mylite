name: CI

on:
  pull_request:
  push:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-clang
            os: macos-latest
            cc: clang
          - name: ubuntu-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: ubuntu-clang
            os: ubuntu-24.04
            cc: clang
          - name: windows-clang
            os: windows-2025
            cc: clang

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            command -v ninja >/dev/null 2>&1 || choco install ninja --no-progress -y
            command -v clang >/dev/null 2>&1 || choco install llvm --no-progress -y
          elif command -v ninja >/dev/null 2>&1; then
            exit 0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  clang-tools:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy ninja-build

      - name: Configure
        env:
          CC: clang
        run: cmake --preset dev

      - name: Check formatting
        run: cmake --build --preset format-check

      - name: Run clang-tidy
        run: cmake --build --preset tidy

  php-extensions:
    name: php-extensions
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build php-cli php-dev

      - name: Configure
        run: cmake --preset php-dev

      - name: Build
        run: cmake --build --preset php-dev

      - name: Test
        run: ctest --preset php-dev -R '^php-ext' --output-on-failure

  wordpress-phpunit:
    name: wordpress-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MYLITE_WORDPRESS_REF: 6ddfc9d9b532c6e95c1266165149815895e2eb56

    steps:
      - uses: actions/checkout@v6

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Run WordPress PHPUnit test suite
        run: tools/wordpress-phpunit-mysqli-mylite --filter 'Tests_DB::test_check_connection_returns_true_when_there_is_a_connection'

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            build/wordpress-tests.mylite \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-php-mylite \
            2>/dev/null || true
          df -h .
